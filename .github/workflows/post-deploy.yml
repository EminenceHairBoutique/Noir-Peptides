# Post-deploy smoke chain (opt cycle 8, scorecard 4.12).
# Vercel's GitHub integration reports every deployment as a GitHub
# Deployment with a status. When a PRODUCTION deployment succeeds, run the
# server-gate specs against the live origin: the attestation and checkout
# endpoints must refuse unauthenticated, stale and malformed requests with
# 401 / 403 / 400. These specs POST only requests the server rejects before
# it writes anything (tests/e2e/checkout-attestation-gate.spec.js), so the
# chain is safe to run on every production deploy.
name: Post-deploy smoke

on:
  deployment_status:
  # Opt cycle 12: manual run against a deployment URL (the first executed
  # record of this gate — every deployment_status run before it failed on
  # Playwright's webServer check, see playwright.config.js).
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment origin to smoke (https://…)"
        required: true
        type: string

jobs:
  prod-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Server gates against the live deployment
        env:
          E2E_API_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
          E2E_BASE_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
        run: npx playwright test tests/e2e/checkout-attestation-gate.spec.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-report
          path: playwright-report/
